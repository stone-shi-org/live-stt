# Override, not standalone: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Target hardware, VERIFIED via nvidia-smi over SSH on 10.100.0.50 (not
# assumed): one NVIDIA RTX 3090, 24GB VRAM, driver 595.84 / CUDA 13.2,
# nvidia-container-toolkit present. NOT the RTX 5090/Blackwell an earlier
# draft speculated from unrelated circumstantial evidence -- see CLAUDE.md.
#
# That box is a SHARED home server (60+ containers, including LocalAI on the
# same GPU) -- this is why LSTT_VRAM_PER_WORKER_MB / LSTT_VRAM_RESERVE_MB
# exist as conscious budgets rather than "assume the whole card", and why
# LSTT_MAX_CONCURRENT_CALLS is small here. No `runtime: nvidia`: the
# reservation below (matching home-docker-script/homestacks/tei.yml, the
# only other GPU-reservation example in this estate) is the modern
# compose-native way and is what this host's docker info already reports
# working (`Runtimes: ... nvidia runc`).
# LS-5: `target: runtime` below is the SAME single image tag
# docker-compose.yml's default service builds -- there is now exactly ONE
# Dockerfile stage/tag for this whole repo (no more runtime-cuda alias
# stage; verified in an earlier phase that it built byte-identical to
# runtime anyway, which is exactly why it was safe to delete rather than
# keep as dead weight). This override file's only remaining job is the
# `deploy.resources.reservations` GPU DEVICE grant below -- a real
# docker-level access decision that can't be "installed at runtime" the
# way engine artifacts can, unlike image content, which is now identical
# either way. Every engine's cpu AND cuda flavors are DOWNLOADED (see
# live_stt/backends/registry.py), most self-contained, needing only the
# real driver at container-run time (the reservation below), never baked
# into any image -- and, as of this phase, diarization engines' heavy
# Python dependency trees (live_stt/diarization_installer.py) are
# downloadable the same way, closing the same gap for the last remaining
# per-capability image tags (runtime-cuda-diarize / -diarize-sortformer,
# both deleted).
#
# Real operational consequence of that: setting `LSTT_*_BACKEND=cuda` env
# vars below is NOT sufficient by itself anymore (unlike the old
# from-source-CUDA-image days) -- Settings' env-to-SQLite migration
# (live_stt/settings_store.py) only seeds the INITIAL value on first boot;
# nothing downloads or activates an actual cuda backend for you. Before the
# first real call on a fresh ./data volume, install+activate each engine's
# cuda flavor once (persists in the mounted volume, survives
# `docker recreate` same as the settings DB):
#   curl -X POST http://<host>:4031/api/backends/install  -d '{"engine":"parakeet","flavor":"cuda"}'
#   curl -X POST http://<host>:4031/api/backends/activate -d '{"engine":"parakeet","flavor":"cuda","version":"<tag from the install response>"}'
#   (repeat for "whisper" if LSTT_WHISPER_BACKEND=cuda too)
# Skipping this is not silently ignored: live_stt/session.py's per-engine
# dispatch fails every call for that engine with a clear WorkerError
# ("no cuda backend has been installed+activated") rather than quietly
# running on CPU while claiming GPU -- see that module's _resolve_lib_dir.
#
# Diarization is the same story, one level up: this image ships neither
# pyannote.audio nor nemo_toolkit[asr] baked in (see
# live_stt/diarization_installer.py) -- if this deployment wants post-call
# diarization, install the engine once (persists in the mounted volume):
#   curl -X POST http://<host>:4031/api/diarization-engines/install -d '{"engine":"pyannote"}'
#   (or {"engine":"nemo_sortformer"} for NVIDIA Sortformer v2.1, LS-4)
# `diarize_in_subprocess` (default True) means diarize_file() spawns a
# fresh `live_stt.diarize_worker` process per request -- that subprocess
# re-runs the same sys.path bootstrap on every invocation, so an install
# takes effect immediately, no container recreate needed.
services:
  live-stt:
    image: live-stt:latest
    build:
      context: .
      target: runtime
    shm_size: '2gb'
    # Raised from an earlier 4g guess after actually running Gate A on this
    # backend (see CLAUDE.md): a SINGLE worker's host-RAM RSS ramped to and
    # plateaued around ~4.4GB after 300s of real speech (415MB -> ~4.37GB,
    # flat thereafter) -- already more than the old 4g limit on its own, and
    # nothing in live_stt/worker.py bounds a worker's RSS at the process
    # level (only RLIMIT_CORE=0 is set, no RLIMIT_AS), so the container-wide
    # mem_limit is the only backstop. With max_workers = max_concurrent_calls
    # + reserve_slots = 3 here, worst case is ~3 x 4.4GB simultaneously
    # (a rotation overlap plus a second call, or two calls rotating in the
    # same window) = ~13.2GB, plus the Python front door's own overhead.
    # 20g leaves real margin above that. Caveats, so this isn't oversold as
    # calibrated: (1) the 300s measurement is one run, not a multi-hour
    # steady-state, so a longer plateau shift can't be ruled out yet: (2)
    # concurrent workers actually sharing host memory bandwidth/allocator
    # behavior under real contention is untested, only inferred by
    # multiplying one isolated worker's number; (3) this host's actual free
    # RAM headroom against its other tenants (60+ containers incl. LocalAI)
    # was NOT re-checked in this pass (a `free -h` was attempted but the SSH
    # session to 10.100.0.50 hung on a stuck forwarded-agent socket before
    # it could run) -- re-verify real headroom exists before trusting this
    # in production, don't just trust the arithmetic above.
    mem_limit: 20g
    environment:
      # LS-5: independent per-engine backend choice, replacing the old
      # single LSTT_BACKEND switch -- all three default to cuda here since
      # this whole override file is "run everything on the RTX 3090," but
      # each is independently overridable (e.g. set
      # LSTT_WHISPER_BACKEND=cpu alongside these to keep whisper off the
      # shared card while parakeet stays on it).
      - LSTT_PARAKEET_BACKEND=cuda
      - LSTT_WHISPER_BACKEND=cuda
      - LSTT_PARAKEET_TDT_BACKEND=cuda
      - LSTT_MAX_CONCURRENT_CALLS=2
      - LSTT_RESERVE_SLOTS=1
      - LSTT_VRAM_PER_WORKER_MB=3000
      - LSTT_VRAM_RESERVE_MB=2000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
