---
# Bamboo YAML Specs for live-stt. Mirrors the my-meeting-notes-docker plan's
# shape (checkout -> test.sh --docker -> JUnit parser -> build.sh -p push),
# adapted for this repo's git submodule (worker/third_party/parakeet.cpp)
# and its LSTT_REGISTRY convention.
#
# ONE job, building the ONE image tag this repo now ships (LS-5's full
# ask, extended past ASR cpu/cuda to diarization engines too -- see
# Dockerfile's "runtime" stage and build.sh). This file used to define
# THREE parallel jobs (plain CPU, CUDA, CUDA+diarize), one per
# separately-BUILT image variant -- collapsed to one job because there is
# no longer a second/third variant to build: every capability beyond the
# always-shipped parakeet/whisper CPU baseline (any ASR engine's cuda
# flavor, any diarization engine's heavy Python dependency tree) is
# installed into this SAME image at container RUNTIME instead, via the
# admin API (live_stt/backends/installer.py, live_stt/
# diarization_installer.py). This also fixes a real, independently-found
# problem the old 3-job shape had: building the CUDA+diarize+(at one point,
# manually) sortformer variant on every single push was disk-hungry enough
# to exhaust the Bamboo agent's disk mid-build (see LIV-LIV-35's real
# "no space left on device" failure) -- with one image now, that pressure
# is gone by construction, not by tuning disk quotas.
#
# One-time manual setup still required in the Bamboo UI (not automatable via
# the REST API used elsewhere in this repo's tooling -- there is no
# project/plan-creation endpoint in this Bamboo instance's REST API):
#   1. Administration -> Linked Repositories -> add this repo
#      (https://github.com/stone-shi/live-stt.git, branch master).
#   2. On that linked repository, enable "Scan for YAML Specs" so Bamboo
#      picks up this file automatically. First scan creates project LSTT /
#      plan LSTT-LSTT ("live-stt-docker"); every push after that re-applies
#      this file, no further UI steps needed.
#   3. Confirm at least one build agent advertises the "system.docker.executable"
#      capability (needed for `./test.sh --docker` and `./build.sh -p`).
version: 2
plan:
  project-key: LIV
  key: LIV
  name: live-stt-docker
stages:
  - Default Stage:
      manual: false
      final: false
      jobs:
        - Default Job
Default Job:
  key: JOB1
  tasks:
    - checkout:
        force-clean-build: 'false'
    - script:
        interpreter: SHELL
        scripts:
          - |
            set -euo pipefail
            git submodule sync --recursive
            git submodule update --init --recursive
    - script:
        interpreter: SHELL
        scripts:
          - |
            # Deliberately not `set -e`: test.sh already isn't (a failing
            # run must still leave test-reports/*.xml for the JUnit parser
            # task below, or Bamboo reports "no test results found" instead
            # of naming the failure). --docker avoids the Python 3.14
            # grpcio wheel gap on a native venv -- see CLAUDE.md.
            ./test.sh --docker
    - test-parser:
        type: junit
        test-results: '**/test-reports/*.xml'
    - script:
        interpreter: SHELL
        scripts:
          - |
            set -euo pipefail
            docker builder prune -af || true
            ./build.sh -p -r registry.shifamily.com/homestack
            docker image prune -f || true
  requirements:
    - system.docker.executable
triggers:
  - polling:
      period: '180'
repositories:
  - live-stt:
      type: github
      url: https://github.com/stone-shi/live-stt.git
      branch: master
branches:
  create: manually
  delete: never
  link-to-jira: false
notifications: []
labels: []
other:
  concurrent-build-plugin: system-default
