---
# Bamboo YAML Specs for live-stt. Mirrors the my-meeting-notes-docker plan's
# shape (checkout -> test.sh --docker -> JUnit parser -> build.sh -p push),
# adapted for this repo's git submodule (worker/third_party/parakeet.cpp)
# and its LSTT_REGISTRY convention.
#
# Three jobs, run in PARALLEL in the same stage (default Bamboo behavior for
# jobs listed under one stage -- no explicit dependency between them), one
# per image variant this repo builds (see build.sh --help): plain CPU, CUDA,
# and CUDA+diarize. Deliberately every push, not manual-only/on-demand --
# chosen over a leaner "CPU on every push, CUDA/diarize manual" split so all
# three tags never drift out of sync with each other or with what's actually
# in the repo. The real cost of that choice: every single push, including a
# one-line CPU-only change, pays for a full CUDA+diarize build+push too
# (~9.5GB image, see CLAUDE.md's Dockerfile runtime-cuda-diarize entry) --
# accepted deliberately, not an oversight. Each job does its own checkout,
# submodule init, and full test.sh run rather than sharing artifacts between
# jobs -- redundant test.sh executions across three PARALLEL jobs cost extra
# agent-minutes, not extra wall-clock, and keeping each job fully
# self-contained avoids Bamboo artifact-passing complexity between them.
# None of the three actually needs a GPU to build (see CLAUDE.md: "10.100.0.50
# itself builds this target fine... no live GPU needed to build, only to
# run"), so the same docker-capable agent pool serves all three jobs.
#
# One-time manual setup still required in the Bamboo UI (not automatable via
# the REST API used elsewhere in this repo's tooling -- there is no
# project/plan-creation endpoint in this Bamboo instance's REST API):
#   1. Administration -> Linked Repositories -> add this repo
#      (https://github.com/stone-shi/live-stt.git, branch master).
#   2. On that linked repository, enable "Scan for YAML Specs" so Bamboo
#      picks up this file automatically. First scan creates project LSTT /
#      plan LSTT-LSTT ("live-stt-docker"); every push after that re-applies
#      this file, no further UI steps needed.
#   3. Confirm at least one build agent advertises the "system.docker.executable"
#      capability (needed for `./test.sh --docker` and every `./build.sh -p`
#      variant below) -- and enough free disk for three concurrent image
#      builds (the diarize one alone is ~9.5GB before layer dedup).
version: 2
plan:
  project-key: LSTT
  key: LSTT
  name: live-stt-docker
stages:
  - Default Stage:
      manual: false
      final: false
      jobs:
        - Default Job
        - CUDA Build Job
        - CUDA Diarize Build Job
Default Job:
  key: JOB1
  tasks:
    - checkout:
        force-clean-build: 'false'
    - script:
        interpreter: SHELL
        scripts:
          - |
            set -euo pipefail
            git submodule sync --recursive
            git submodule update --init --recursive
    - script:
        interpreter: SHELL
        scripts:
          - |
            # Deliberately not `set -e`: test.sh already isn't (a failing
            # run must still leave test-reports/*.xml for the JUnit parser
            # task below, or Bamboo reports "no test results found" instead
            # of naming the failure). --docker avoids the Python 3.14
            # grpcio wheel gap on a native venv -- see CLAUDE.md.
            ./test.sh --docker
    - test-parser:
        type: junit
        test-results: '**/test-reports/*.xml'
    - script:
        interpreter: SHELL
        scripts:
          - |
            set -euo pipefail
            ./build.sh -p -r registry.shifamily.com/homestack
  requirements:
    - system.docker.executable
CUDA Build Job:
  key: JOB2
  tasks:
    - checkout:
        force-clean-build: 'false'
    - script:
        interpreter: SHELL
        scripts:
          - |
            set -euo pipefail
            git submodule sync --recursive
            git submodule update --init --recursive
    - script:
        interpreter: SHELL
        scripts:
          - |
            # Same test.sh as Default Job -- there is no separate CUDA-only
            # test suite (gpu-marked tests need a real device this agent
            # pool doesn't have, see CLAUDE.md), this just gates the CUDA
            # build on the same offline-safe unit tests as the CPU one.
            ./test.sh --docker
    - test-parser:
        type: junit
        test-results: '**/test-reports/*.xml'
    - script:
        interpreter: SHELL
        scripts:
          - |
            set -euo pipefail
            ./build.sh --cuda -p -r registry.shifamily.com/homestack
  requirements:
    - system.docker.executable
CUDA Diarize Build Job:
  key: JOB3
  tasks:
    - checkout:
        force-clean-build: 'false'
    - script:
        interpreter: SHELL
        scripts:
          - |
            set -euo pipefail
            git submodule sync --recursive
            git submodule update --init --recursive
    - script:
        interpreter: SHELL
        scripts:
          - |
            ./test.sh --docker
    - test-parser:
        type: junit
        test-results: '**/test-reports/*.xml'
    - script:
        interpreter: SHELL
        scripts:
          - |
            set -euo pipefail
            ./build.sh --cuda --diarize -p -r registry.shifamily.com/homestack
  requirements:
    - system.docker.executable
triggers:
  - polling:
      period: '180'
repositories:
  - live-stt:
      type: github
      url: https://github.com/stone-shi/live-stt.git
      branch: master
branches:
  create: manually
  delete: never
  link-to-jira: false
notifications: []
labels: []
other:
  concurrent-build-plugin: system-default
