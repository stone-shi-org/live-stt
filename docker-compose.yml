services:
  live-stt:
    # Matches build.sh's default local tag (no -r/LSTT_REGISTRY): `./build.sh`
    # then `docker compose up -d` reuses that image without a second,
    # registry-less build here.
    image: live-stt:latest
    build:
      context: .
      target: runtime
    container_name: live-stt
    env_file:
      - .env
    init: true  # tini as PID 1 -- reaps zombies if a worker is ever orphaned
    ulimits:
      core: 0  # ggml aborts (not raises) on some allocation failures; this
               # is the only containable defense against a multi-GB core
               # file per crash/rotation -- /proc/sys/kernel/core_pattern is
               # host-global and can't be set from inside a container.
    # Backstop for parakeet.cpp#63 (see CLAUDE.md) -- measured much smaller
    # on this repo's CPU build than the upstream CUDA report, but sized to
    # survive being wrong about that, not to the measured number exactly.
    mem_limit: 6g
    # Must exceed LSTT_DRAIN_TIMEOUT_SEC (default 300s) -- Docker's own
    # default of 10s would SIGKILL every active call before the servicer's
    # own graceful drain even gets a chance to run.
    stop_grace_period: 330s
    ports:
      - "4030:50051"  # gRPC -- dial this directly; see the Traefik note below
      - "4031:8000"   # admin HTTP: /api/health /api/version /api/stats /metrics
    volumes:
      # Model MOUNTED, never baked into the image -- and read-only, so a bug
      # in this service can't corrupt it.
      - ./models:/models:ro
      # Bind, not a named volume: same backup-ability reasoning as
      # my-meeting-notes' ./data mount. Holds the SQLite settings DB and the
      # persistent backend-install directory (LSTT_BACKENDS_DIR) -- both
      # survive `docker recreate`/image upgrades by design (LS-5).
      - ./data:/app/data
      # LS-5: required for live_stt/backends/installer.py's oci_image
      # install path (whisper:cuda today -- see registry.py's docstring) to
      # work at all -- it shells out to `docker create`/`docker cp` against
      # the HOST's docker daemon to extract a prebuilt .so from a real
      # ghcr.io image, since that flavor isn't buildable from a plain
      # release tarball the way every github_release-sourced flavor is.
      # Found missing for real: an operator hit installer.py's own "docker
      # is not available in this environment" error trying to install it
      # against a deployed container with no socket mounted and no `docker`
      # CLI on PATH (the latter half fixed in the Dockerfile's runtime
      # stage; this mount is the other half).
      #
      # REAL SECURITY TRADEOFF, not a routine bind mount: a container with
      # the host's docker.sock can create/run containers with arbitrary
      # host bind mounts (e.g. `-v /:/host`), which is equivalent to root on
      # the HOST, not just this container -- this is a well-known, serious
      # container-escape vector, independent of anything this codebase does
      # with the socket itself. Accepted here because (a) this service
      # already runs as root with no seccomp/AppArmor hardening beyond
      # RLIMIT_CORE=0, so it isn't crossing an existing privilege boundary
      # that wasn't already soft, and (b) the alternative (rebuilding/
      # re-pushing an image just to add a CUDA flavor) is exactly what LS-5
      # set out to eliminate. If this service's threat model ever tightens
      # (e.g. exposed beyond home-net), replace this with a scoped socket
      # proxy (e.g. tecnativa/docker-socket-proxy limited to CREATE/
      # POST/containers/*/archive) rather than the raw socket -- not done
      # here since nothing on this deployment's actual threat model today
      # requires it, but don't copy this mount into a less-trusted context
      # without that hardening.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - home-net
    labels:
      # Admin port only. Do NOT put the gRPC port behind Traefik: the
      # shared web-secure entrypoint's writeTimeout=600s would silently
      # truncate every call at 10 minutes (see CLAUDE.md's Ops notes). The
      # telephony app is internal and already on home-net -- it dials
      # live-stt:50051 directly, bypassing Traefik entirely.
      - "traefik.enable=true"
      - "traefik.docker.network=home-net"
      - "traefik.http.services.live-stt.loadbalancer.server.port=8000"
      - "traefik.http.routers.live-stt.rule=Host(`live-stt.local.shifamily.com`)"
      - "traefik.http.routers.live-stt.entrypoints=web-secure"
      - "traefik.http.routers.live-stt.tls=true"
      - "traefik.http.routers.live-stt.tls.certresolver=le"
      - "traefik.http.routers.live-stt-http.rule=Host(`live-stt.local.shifamily.com`)"
      - "traefik.http.routers.live-stt-http.entrypoints=web"
      - "traefik.http.routers.live-stt-http.middlewares=live-stt-https"
      - "traefik.http.middlewares.live-stt-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.live-stt-https.redirectscheme.permanent=true"

networks:
  home-net:
    external: true
